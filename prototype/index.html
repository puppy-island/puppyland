<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puppyland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@300;400;500&family=Nunito:wght@400;600&family=Schoolbell&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg class="svg-defs" aria-hidden="true" focusable="false">
  <symbol id="paw" viewBox="0 0 26 26">
    <ellipse cx="6.2" cy="9.4" rx="2.7" ry="3.5" transform="rotate(-20 6.2 9.4)"/>
    <ellipse cx="11.6" cy="6.4" rx="2.8" ry="3.7"/>
    <ellipse cx="17.2" cy="7.0" rx="2.8" ry="3.7" transform="rotate(14 17.2 7)"/>
    <ellipse cx="21.6" cy="11.6" rx="2.5" ry="3.2" transform="rotate(30 21.6 11.6)"/>
    <path d="M13.6 12.4c4.3 0 7.3 2.6 7.3 5.8 0 3-2.6 4.6-5.2 4.6-1.5 0-2.2-.5-3.3-.5-1.1 0-1.8.5-3.3.5-2.6 0-5.2-1.6-5.2-4.6 0-3.2 3-5.8 7.3-5.8Z"/>
  </symbol>
  <symbol id="play" viewBox="0 0 24 24"><path d="M9 6.6c0-.9 1-1.4 1.7-.9l7.2 4.9a1.1 1.1 0 0 1 0 1.8l-7.2 4.9c-.7.5-1.7 0-1.7-.9V6.6Z"/></symbol>
  <symbol id="send" viewBox="0 0 24 24"><path d="M4.3 11.2 18.6 5.1c.9-.4 1.8.5 1.4 1.4l-6.1 14.3c-.4 1-1.8.9-2.1-.1l-1.6-5.3-5.3-1.6c-1-.3-1.1-1.7-.1-2.1Z"/></symbol>
  <symbol id="camera" viewBox="0 0 24 24"><path d="M9.2 4.5h5.6l1.1 2h2.6a2 2 0 0 1 2 2v8.8a2 2 0 0 1-2 2H5.5a2 2 0 0 1-2-2V8.5a2 2 0 0 1 2-2h2.6l1.1-2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12.8" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
</svg>

<div id="app">
  <div class="stage" id="stage">
    <div class="grain" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <!-- ── 品牌开屏 ─────────────────────────────────── -->
    <section class="scene splash-screen" data-scene="splash" aria-label="Puppyland 开屏">
      <div class="splash-center" aria-hidden="true">
        <img src="assets/puppyland-mark.png" alt="">
      </div>
      <div class="splash-brand" aria-label="Puppyland">
        <img src="assets/puppyland-mark.png" alt="">
        <span>Puppyland</span>
      </div>
    </section>

    <!-- ── 第二阶段：连续叙事式记忆旅程 ───────────────── -->
    <section class="scene journey-page" data-scene="journey" aria-label="记忆旅程">
      <div class="journey-world" id="journeyWorld">
        <div class="journey-sky"></div>
        <div class="journey-mountains"></div>
        <div class="journey-ground"></div>
        <div class="journey-road"></div>
        <div class="journey-bridge" aria-hidden="true"><span></span></div>
        <div class="journey-particles" id="journeyParticles"></div>
        <div class="journey-ripples" aria-hidden="true"></div>
        <div class="pet-slot journey-pet" id="journeyPet">
          <img class="pet" src="assets/pet-idle.webp" alt="正在找回自己的小狗">
        </div>
        <video class="journey-group-video" id="journeyGroupVideo" src="assets/puppy-group-bridge.mp4" muted playsinline preload="auto" aria-label="小狗们一起走过彩虹桥"></video>
      </div>
      <div class="journey-progress" id="journeyProgress" aria-label="记忆旅程足迹"></div>
      <div class="journey-card" id="journeyCard">
        <p class="journey-kicker" id="journeyKicker">召回 TA</p>
        <h2 class="journey-title" id="journeyTitle">我好像……记不清自己原来的样子了</h2>
        <p class="journey-copy" id="journeyCopy">你可以帮我想起来吗？</p>
        <div class="journey-creator" id="journeyCreator">
          <button class="journey-voice" id="journeyVoice" type="button" aria-label="按住爪子，说说你记忆里的 TA 吧">
            <svg viewBox="0 0 26 26"><use href="#paw"></use></svg>
          </button>
          <span class="journey-voice-label" id="journeyVoiceLabel">按住爪子，说说你记忆里的 TA 吧</span>
        </div>
        <div class="journey-confirm" id="journeyConfirm" hidden>
          <div class="journey-confirm-tools">
            <p>照片会帮助我更快找回自己的样子。</p>
            <label class="journey-add-photo" aria-label="补充照片，让小狗更像记忆里的样子">
              <input id="journeyRegeneratePhoto" type="file" accept="image/*">
              <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#camera"></use></svg>
              <span>补充照片</span>
            </label>
          </div>
          <button class="ghost-btn journey-confirm-btn" id="journeyConfirmBtn" type="button">暂时跳过</button>
        </div>
      </div>
    </section>

    <!-- ── 从狗狗社区进入属于 TA 的家 ────────────────── -->
    <section class="scene neighborhood-scene" data-scene="weave" aria-label="寻找属于小狗的家">
      <div class="neighborhood-camera" aria-hidden="true">
        <div class="neighborhood-map">
          <img src="assets/puppy-neighborhood.jpg" alt="">
          <i class="neighbor-light light-one"></i>
          <i class="neighbor-light light-two"></i>
          <i class="neighbor-light light-three"></i>
          <div class="chosen-home">
            <span class="chosen-halo"></span>
            <svg viewBox="0 0 26 26"><use href="#paw"></use></svg>
          </div>
        </div>
        <div class="neighborhood-wash"></div>
        <div class="neighborhood-closeup"></div>
      </div>
      <div class="dock">
        <p class="narration serif" id="nWeave"></p>
      </div>
    </section>

    <!-- ── 第三阶段：家园入口 ─────────────────────────── -->
    <section class="scene home-hub" data-scene="home" aria-label="小狗的家">
      <div class="home-art" aria-hidden="true"></div>
      <div class="home-night" aria-hidden="true"></div>
      <button class="home-hotspot home-lamp" id="homeLamp" type="button" aria-label="关灯，让小狗休息"></button>
      <button class="home-hotspot home-mailbox" id="homeMailbox" type="button" aria-label="打开信箱，阅读今天的来信"></button>
      <button class="home-hotspot home-bowl" id="homeBowl" type="button" aria-label="点击饭盆"></button>
      <button class="home-hotspot home-pet" id="homePet" type="button" aria-label="和小狗说说话"></button>
      <p class="home-bubble" id="homeNote" role="status" aria-live="polite"></p>
    </section>

    <!-- ── 读信子页面 ───────────────────────────────── -->
    <section class="scene letter-page" data-scene="letter" aria-label="今天的来信">
      <section class="letter-sheet" id="letterSheet" aria-labelledby="letterTitle" hidden>
        <button class="letter-close" id="letterClose" type="button" aria-label="回到家">×</button>
        <div class="letter-reading">
          <p class="letter-date" id="letterDate"></p>
          <h2 id="letterTitle">今天的信</h2>
          <div class="letter-body" id="letterBody"></div>
          <p class="letter-sign" id="letterSign"></p>
        </div>
      </section>
    </section>

    <!-- ── Companion：小狗对话 ───────────────────────── -->
    <section class="scene companion" data-scene="companion" aria-label="家园">
      <header class="c-head">
        <span class="c-name" id="cName">家</span>
        <span class="c-sub" id="cSub">灯还亮着</span>
        <button class="home-back" id="homeBack" type="button" aria-label="回到小狗的家">
          <span class="home-back-roof"></span><span class="home-back-wall"></span>
        </button>
      </header>
      <div class="thread" id="thread" role="log" aria-live="polite"></div>
      <div class="pet-slot companion-pet" id="petC"><img class="pet" src="assets/pet-idle.webp" alt="小狗陪在身边"></div>
      <form class="composer" id="composer" autocomplete="off">
        <input class="c-input" id="cInput" type="text" placeholder="说点什么…" aria-label="说点什么">
        <button class="icon-btn continue" id="btnContinue" type="button" aria-label="继续，让故事往下走">
          <svg viewBox="0 0 24 24"><use href="#play"></use></svg>
        </button>
        <button class="icon-btn send" id="btnSend" type="submit" aria-label="发送">
          <svg viewBox="0 0 24 24"><use href="#send"></use></svg>
        </button>
      </form>
    </section>

    <!-- 通用：语音录制浮层 -->
    <div class="rec-overlay" id="recOverlay" hidden>
      <div class="rec-card">
        <div class="wave" id="wave" aria-hidden="true"></div>
        <p class="rec-tip" id="recTip">松开结束</p>
      </div>
    </div>
  </div>

  <p class="stage-note">键盘 <kbd>1</kbd> 召回 · <kbd>2</kbd> 记忆旅程 · <kbd>3</kbd> 家园 · <kbd>4</kbd> 对话 · <kbd>R</kbd> 重来</p>
</div>

<script src="app.js"></script>
</body>
</html>
